<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>画像1枚から歩ける空間 — Muse Wonder実験</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#060809;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .ui{position:fixed;left:0;right:0;pointer-events:none;color:#f2ead8;text-align:center;z-index:5;}
  #title{top:14px;font-size:15px;letter-spacing:.18em;text-shadow:0 1px 8px rgba(0,0,0,.8);}
  #title small{display:block;font-size:10px;letter-spacing:.3em;color:#c9a86a;margin-bottom:4px;}
  #hint{bottom:52px;font-size:11.5px;color:rgba(242,234,216,.85);text-shadow:0 1px 6px rgba(0,0,0,.9);line-height:1.7;}
  #style{bottom:16px;font-size:12px;letter-spacing:.25em;color:#ffd678;text-shadow:0 1px 6px rgba(0,0,0,.9);}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#c9a86a;font-size:13px;letter-spacing:.3em;background:#060809;z-index:9;transition:opacity .8s;}
  .btns{position:fixed;right:12px;bottom:64px;display:flex;flex-direction:column;gap:8px;z-index:6;}
  .btns button{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,214,120,.5);background:rgba(10,12,14,.55);color:#ffd678;font-size:17px;cursor:pointer;}
  .btns button:active{background:rgba(255,214,120,.25);}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">読み込み中</div>
<div class="ui" id="title"><small>IMAGE → SPACE</small>京都・花見小路</div>
<div class="ui" id="hint">ドラッグで見回す ／ ホイール・ボタンで前後<br>画面をタップすると、触れた場所から世界が塗り替わる</div>
<div class="ui" id="style">実写</div>
<div style="position:fixed;left:10px;bottom:10px;font-size:9.5px;color:rgba(242,234,216,.55);z-index:5;letter-spacing:.08em;">Photo: xiquinhosilva / CC BY 2.0 (Wikimedia Commons)</div><div class="btns"><button id="fwd">＋</button><button id="back">−</button></div>

<script type="module">
import * as THREE from './three.module.js';

const IMG = 'kyoto_small.jpg';
const DEP = 'depth.png';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060809);
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.05, 60);

const loader = new THREE.TextureLoader();
const [tex, dep] = await Promise.all([loader.loadAsync(IMG), loader.loadAsync(DEP)]);
tex.colorSpace = THREE.SRGBColorSpace;
const aspect = tex.image.width / tex.image.height;
const W = 3.2, H = W / aspect;

const uniforms = {
  uTex: {value: tex},
  uDep: {value: dep},
  uFrom: {value: 0}, uTo: {value: 0},
  uCenter: {value: new THREE.Vector2(0.5, 0.5)},
  uStart: {value: -10},
  uTime: {value: 0},
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  side: THREE.DoubleSide,
  vertexShader: `
    uniform sampler2D uDep;
    varying vec2 vUv;
    void main(){
      vUv = uv;
      vec3 p = position;
      float d = texture2D(uDep, uv).r;
      p.z += (d - 0.55) * 1.15;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D uTex;
    uniform float uFrom, uTo, uStart, uTime;
    uniform vec2 uCenter;
    varying vec2 vUv;
    vec3 grade(vec3 c, float s){
      if (s < 0.5) return c;                                   // 実写
      if (s < 1.5) {                                           // アニメ風
        vec3 p = floor(c * 6.0) / 6.0;
        float l = dot(p, vec3(0.299, 0.587, 0.114));
        return clamp(mix(vec3(l), p, 1.45) * 1.06, 0.0, 1.0);
      }                                                        // 夜
      vec3 n = c * vec3(0.30, 0.42, 0.78);
      float warm = pow(max(c.r - c.b, 0.0), 2.0);
      return n + vec3(1.0, 0.55, 0.22) * warm * 1.1;
    }
    void main(){
      vec3 c = texture2D(uTex, vUv).rgb;
      float r = distance(vUv * vec2(1.6, 1.0), uCenter * vec2(1.6, 1.0));
      float wave = (uTime - uStart) * 0.55;
      float m = smoothstep(wave, wave - 0.25, r);
      vec3 col = mix(grade(c, uFrom), grade(c, uTo), m);
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const mesh = new THREE.Mesh(new THREE.PlaneGeometry(W, H, 220, 146), mat);
scene.add(mesh);

// --- 操作: 見回し＋前後移動（小さな範囲に制限して破綻を防ぐ） ---
let yaw = 0, pitch = 0, dist = 1.55, tx = 0, ty = 0;
let dragging = false, px = 0, py = 0, moved = 0, downT = 0;
const el = renderer.domElement;
el.style.touchAction = 'none';
el.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; moved = 0; downT = performance.now(); });
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw = THREE.MathUtils.clamp(yaw - dx * 0.0022, -0.42, 0.42);
  pitch = THREE.MathUtils.clamp(pitch - dy * 0.0022, -0.26, 0.26);
});
el.addEventListener('pointerup', e => {
  dragging = false;
  if (moved < 6 && performance.now() - downT < 400) tap(e);
});
el.addEventListener('wheel', e => { e.preventDefault(); dist = THREE.MathUtils.clamp(dist - e.deltaY * 0.0012, 0.95, 2.1); }, {passive:false});
const hold = (id, fn) => {
  const b = document.getElementById(id);
  let iv = null;
  b.addEventListener('pointerdown', e => { e.stopPropagation(); fn(); iv = setInterval(fn, 50); });
  ['pointerup','pointerleave','pointercancel'].forEach(t => b.addEventListener(t, () => clearInterval(iv)));
};
hold('fwd', () => dist = THREE.MathUtils.clamp(dist - 0.03, 0.95, 2.1));
hold('back', () => dist = THREE.MathUtils.clamp(dist + 0.03, 0.95, 2.1));

// --- タップで塗り替え（実写→アニメ→夜→実写…） ---
const names = ['実写', 'アニメ', '夜'];
let style = 0;
const ray = new THREE.Raycaster();
function tap(e){
  const r = el.getBoundingClientRect();
  const nd = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(nd, camera);
  const hit = ray.intersectObject(mesh)[0];
  const next = (style + 1) % 3;
  uniforms.uFrom.value = style;
  uniforms.uTo.value = next;
  uniforms.uCenter.value.copy(hit ? hit.uv : new THREE.Vector2(0.5, 0.5));
  uniforms.uStart.value = uniforms.uTime.value;
  style = next;
  document.getElementById('style').textContent = names[style];
}

document.getElementById('loading').style.opacity = '0';
setTimeout(() => document.getElementById('loading').remove(), 900);

const clock = new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  uniforms.uTime.value = clock.getElapsedTime();
  camera.position.set(tx, ty, dist);
  camera.lookAt(Math.sin(yaw) * 2, pitch * 2, dist - 2);
  renderer.render(scene, camera);
})();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
