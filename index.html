<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>花見小路 リアル3D空間（Atlas生成・FPSテスト）</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
  .pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;backdrop-filter:blur(4px)}
  #modeBtn{pointer-events:auto;border:1px solid rgba(255,255,255,.4);cursor:pointer}
  #loading{position:fixed;inset:0;background:#0a0f1e;color:#fff;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:30;text-align:center;padding:20px}
  #loading .big{font-size:20px;font-weight:700}
  #loading .sub{font-size:13px;opacity:.75;line-height:1.7}
  #barWrap{width:min(420px,80vw);height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
  #bar{height:100%;width:0%;background:#39d98a;transition:width .2s}
  #help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none}
  #joy{position:fixed;left:22px;bottom:64px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);z-index:11;touch-action:none;display:none}
  #stick{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,-50%)}
  @media (pointer:coarse){ #joy{display:block} #help{display:none} }
  #debug{position:fixed;left:8px;bottom:8px;color:#0f0;background:rgba(0,0,0,.7);font:11px monospace;padding:6px;z-index:40;white-space:pre-wrap;max-width:90vw;display:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/",
    "@sparkjsdev/spark": "./lib/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">
  <div class="big">🌏 花見小路 リアル3D空間</div>
  <div id="loadMsg" class="sub">3Dデータを読み込み中…（約31MBあります。Wi-Fi推奨）</div>
  <div id="barWrap"><div id="bar"></div></div>
  <div class="sub">Atlas（World Labs）が写真から生成した、本物の3D空間です</div>
</div>
<div id="hud" style="visibility:hidden">
  <div class="pill">📍 花見小路（Atlas生成）</div>
  <button id="modeBtn" class="pill">🎨 見た目：実写</button>
</div>
<div id="help"><div class="pill">ドラッグ／クリックで見回す ・ WASD／矢印で歩く ・ 左下スティックでも歩けるよ</div></div>
<div id="joy"><div id="stick"></div></div>
<div id="debug"></div>

<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const q = new URLSearchParams(location.search);
const debugEl = document.getElementById('debug');
const debug = q.has('debug');
if (debug) debugEl.style.display = 'block';
function log(s){ if(debug){ debugEl.textContent += s + "\n"; } console.log(s); }

const loadMsg = document.getElementById('loadMsg');
const bar = document.getElementById('bar');

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(parseFloat(q.get('pr') || String(Math.min(devicePixelRatio, 2))));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5d9);
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 2000);

const spark = new SparkRenderer({ renderer });
scene.add(spark);

const splat = new SplatMesh({
  url: q.get('file') || "kyoto.spz",
  onProgress: (e) => {
    if (e && e.total) { const p = Math.round(100*e.loaded/e.total); bar.style.width = p + "%"; loadMsg.textContent = `3Dデータを読み込み中… ${p}%`; }
  }
});
// Optional orientation overrides for calibration: ?rx=180&ry=0&rz=0 (degrees)
const rx = parseFloat(q.get('rx')||'0'), ry = parseFloat(q.get('ry')||'0'), rz = parseFloat(q.get('rz')||'0');
splat.rotation.set(THREE.MathUtils.degToRad(rx), THREE.MathUtils.degToRad(ry), THREE.MathUtils.degToRad(rz));
scene.add(splat);

// ---- FPS state ----
// Start framing can be overridden: ?cx=&cy=&cz=&yaw=&pitch=
let yaw = parseFloat(q.get('yaw')||'0'), pitch = parseFloat(q.get('pitch')||'0');
const pos = new THREE.Vector3(parseFloat(q.get('cx')||'0'), parseFloat(q.get('cy')||'1.6'), parseFloat(q.get('cz')||'8'));
let eyeH = 1.6, bounds = { minX:-14, maxX:14, minZ:-20, maxZ:20 }, corridor = null;
const keys = {};
let joyVec = {x:0, y:0};

function applyCam(){
  camera.position.copy(pos);
  const dir = new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(pos.clone().add(dir));
}

splat.initialized.then(() => {
  try {
    if (q.has('diag')) {
      const xs=[], ys=[], zs=[];
      splat.forEachSplat((i, center) => { if (i % 10 === 0){ xs.push(center.x); ys.push(center.y); zs.push(center.z); } });
      const pct = (a,p) => { const s=[...a].sort((x,y)=>x-y); return +s[Math.floor(p/100*s.length)].toFixed(2); };
      window.__stats = { n: xs.length,
        x: [pct(xs,1), pct(xs,50), pct(xs,99)], y: [pct(ys,1), pct(ys,50), pct(ys,99)], z: [pct(zs,1), pct(zs,50), pct(zs,99)] };
      window.__ready = true; return;
    }
    if (q.has('cx')) { log('START override pos=' + pos.toArray().map(v=>v.toFixed(1)) + ' yaw=' + yaw); window.__ready = true; document.getElementById('loading').style.display='none'; document.getElementById('hud').style.visibility='visible'; return; }
    if (!q.get('file')) {
      // Kyoto v2 (2026-11-18): start at the photographer's end (densest, sharpest area),
      // looking down the street; movement fenced to a corridor along the street axis,
      // following the official viewer practice of staying near the captured viewpoints.
      pos.set(-10.5, 1.7, -13); yaw = 0.61; pitch = 0;
      corridor = { ax: -6, az: -7, bx: -28, bz: -40, lat: 3 };
      log('START kyoto preset pos=' + pos.toArray().map(v=>v.toFixed(1)) + ' yaw=' + yaw);
      window.__ready = true;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('hud').style.visibility = 'visible';
      return;
    }
    // Robust framing from sampled splat centers (percentiles, outlier-resistant).
    const xs=[], ys=[], zs=[];
    splat.forEachSplat((i, center) => { if (i % 20 === 0){ xs.push(center.x); ys.push(center.y); zs.push(center.z); } });
    const pct = (a,p) => { const s=[...a].sort((x,y)=>x-y); return s[Math.min(s.length-1, Math.max(0, Math.floor(p/100*s.length)))]; };
    const lo = new THREE.Vector3(pct(xs,2), pct(ys,1), pct(zs,2));
    const hi = new THREE.Vector3(pct(xs,98), pct(ys,99), pct(zs,98));
    const med = new THREE.Vector3(pct(xs,50), pct(ys,50), pct(zs,50));
    const size = hi.clone().sub(lo);
    log(`ROBUST lo=${lo.toArray().map(v=>v.toFixed(1))} hi=${hi.toArray().map(v=>v.toFixed(1))} med=${med.toArray().map(v=>v.toFixed(1))} size=${size.toArray().map(v=>v.toFixed(1))} samples=${xs.length}`);
    if (!q.has('cx')) {
      eyeH = 1.6;
      pos.set(med.x, lo.y + eyeH, med.z + size.z*0.16);
      bounds = { minX: pct(xs,6), maxX: pct(xs,94), minZ: pct(zs,6), maxZ: pct(zs,94) };
      log(`START pos=${pos.toArray().map(v=>v.toFixed(1))} eyeH=${eyeH} bounds=${JSON.stringify(bounds)}`);
    }
    window.__ready = true;
  } catch(e){ log('frame error ' + e.message); window.__ready = true; }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hud').style.visibility = 'visible';
}).catch(e => { loadMsg.textContent = '読み込みに失敗しました：' + e.message; log('ERR ' + e.message); });

// ---- Look controls ----
let dragging = false, lastX=0, lastY=0, lastTap=0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.0032; pitch -= (e.clientY - lastY) * 0.0032;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
el.addEventListener('pointerup', () => { dragging = false; });
el.addEventListener('pointercancel', () => { dragging = false; });

// ---- Keys ----
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

// ---- Joystick ----
const joy = document.getElementById('joy'), stick = document.getElementById('stick');
let joyId = null;
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(joyId); moveJoy(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) moveJoy(e); });
joy.addEventListener('pointerup', e => { if (e.pointerId === joyId){ joyId = null; joyVec = {x:0,y:0}; stick.style.transform = 'translate(-50%,-50%)'; }});
function moveJoy(e){
  const r = joy.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = (e.clientX - cx)/(r.width/2), dy = (e.clientY - cy)/(r.height/2);
  const len = Math.hypot(dx, dy); if (len > 1){ dx/=len; dy/=len; }
  joyVec = {x:dx, y:dy};
  stick.style.transform = `translate(calc(-50% + ${dx*32}px), calc(-50% + ${dy*32}px))`;
}

// ---- Visual mode (tap repaint: real -> anime -> night) ----
const modes = [
  { name:'実写', filter:'none' },
  { name:'アニメ', filter:'saturate(1.7) contrast(1.12) brightness(1.06)' },
  { name:'夜', filter:'brightness(0.55) hue-rotate(18deg) saturate(1.25)' },
];
let modeIdx = 0;
const modeBtn = document.getElementById('modeBtn');
function cycleMode(){ modeIdx = (modeIdx+1)%modes.length; el.style.filter = modes[modeIdx].filter; modeBtn.textContent = '🎨 見た目：' + modes[modeIdx].name; }
modeBtn.addEventListener('click', cycleMode);
el.addEventListener('dblclick', cycleMode);

// ---- Main loop ----
const clock = new THREE.Clock();
const freezeAt = parseInt(q.get('freeze') || '0');
let framesAfterReady = 0;
function tick(){
  if (freezeAt && window.__ready && ++framesAfterReady > freezeAt){
    applyCam(); renderer.render(scene, camera); window.__frozen = true; return;
  }
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const speed = 4.2 * dt;
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const mv = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) mv.add(fwd);
  if (keys['KeyS'] || keys['ArrowDown']) mv.sub(fwd);
  if (keys['KeyD'] || keys['ArrowRight']) mv.add(right);
  if (keys['KeyA'] || keys['ArrowLeft']) mv.sub(right);
  mv.addScaledVector(fwd, -joyVec.y).addScaledVector(right, joyVec.x);
  if (mv.lengthSq() > 0){ mv.normalize().multiplyScalar(speed); pos.add(mv); }
  if (corridor){
    // Clamp to a corridor along the street axis (A -> B), lateral limit in metres.
    const ux = corridor.bx - corridor.ax, uz = corridor.bz - corridor.az;
    const L = Math.hypot(ux, uz), nx = ux / L, nz = uz / L;
    const rx = pos.x - corridor.ax, rz = pos.z - corridor.az;
    let s = Math.max(0, Math.min(L, rx * nx + rz * nz));
    let t = Math.max(-corridor.lat, Math.min(corridor.lat, rx * -nz + rz * nx));
    pos.x = corridor.ax + nx * s + -nz * t;
    pos.z = corridor.az + nz * s + nx * t;
  } else {
    pos.x = Math.max(bounds.minX, Math.min(bounds.maxX, pos.x));
    pos.z = Math.max(bounds.minZ, Math.min(bounds.maxZ, pos.z));
  }
  applyCam();
  renderer.render(scene, camera);
}
applyCam();
window.__renderOnce = () => { applyCam(); renderer.render(scene, camera); };
if (!q.has('manual')) tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
