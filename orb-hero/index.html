<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>共鳴する宇宙。 — Orb Hero Demo</title>
<style>
  :root{
    --ink:#ece7da;
    --ink-dim:rgba(236,231,218,.55);
    --gold:#e6c87a;
    --cyan:#8fdcef;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#050914;
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP",serif;
    overflow:hidden;
    height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  canvas#scene{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }
  .demo-tag{
    position:fixed;
    top:calc(18px + env(safe-area-inset-top));
    left:22px;
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:10px;
    letter-spacing:.34em;
    color:rgba(236,231,218,.34);
    z-index:3;
    user-select:none;
  }
  .hero-copy{
    position:fixed;
    left:0;right:0;
    bottom:15.5%;
    text-align:center;
    z-index:2;
    pointer-events:none;
    animation:rise 2.2s cubic-bezier(.22,.8,.3,1) both .3s;
  }
  .hero-copy .sub{
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:clamp(10px,1.4vw,12px);
    letter-spacing:.62em;
    text-indent:.62em;
    color:rgba(230,200,122,.72);
    margin-bottom:clamp(14px,2.4vh,24px);
  }
  .hero-copy h1{
    font-weight:500;
    font-size:clamp(30px,6.4vw,58px);
    letter-spacing:.16em;
    text-indent:.16em;
    line-height:1.25;
    color:var(--ink);
    text-shadow:0 0 26px rgba(5,9,20,.9),0 0 60px rgba(5,9,20,.6);
  }
  .scroll-cue{
    position:fixed;
    left:50%;
    bottom:calc(22px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    z-index:2;
    pointer-events:none;
    animation:rise 2.2s ease both 1s;
  }
  .scroll-cue .label{
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:9px;
    letter-spacing:.4em;
    text-indent:.4em;
    color:var(--ink-dim);
  }
  .scroll-cue .track{
    width:1px;
    height:52px;
    background:rgba(236,231,218,.14);
    position:relative;
    overflow:hidden;
  }
  .scroll-cue .dot{
    position:absolute;
    left:50%;
    top:-8px;
    width:3px;height:8px;
    margin-left:-1.5px;
    border-radius:2px;
    background:var(--cyan);
    opacity:0;
    animation:drop 2.6s cubic-bezier(.5,.1,.4,1) infinite;
  }
  @keyframes drop{
    0%{transform:translateY(0);opacity:0}
    18%{opacity:.9}
    70%{opacity:.9}
    100%{transform:translateY(62px);opacity:0}
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }
  .scroll-cue{animation-name:riseCue}
  @keyframes riseCue{
    from{opacity:0;transform:translate(-50%,14px)}
    to{opacity:1;transform:translate(-50%,0)}
  }
  @media (prefers-reduced-motion: reduce){
    .hero-copy,.scroll-cue{animation:none}
    .scroll-cue .dot{animation:none;opacity:0}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="demo-tag">DEMO</div>

<header class="hero-copy">
  <p class="sub">RESONANCE</p>
  <h1>共鳴する宇宙。</h1>
</header>

<div class="scroll-cue" aria-hidden="true">
  <span class="label">SCROLL</span>
  <span class="track"><span class="dot"></span></span>
</div>

<script>
(function(){
  'use strict';
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, DPR = 1;
  var bgGrad = null, glowGrad = null;

  // ---- responsive particle budgets ----
  var smallScreen = Math.min(window.innerWidth, window.innerHeight) < 620;
  var SPHERE_N = smallScreen ? 430 : 980;
  var STAR_N   = smallScreen ? 70  : 150;

  // ---- soft dot sprites (avoids shadowBlur cost) ----
  function makeSprite(rgb){
    var s = document.createElement('canvas');
    s.width = s.height = 32;
    var c = s.getContext('2d');
    var g = c.createRadialGradient(16,16,0,16,16,16);
    g.addColorStop(0,   'rgba(' + rgb + ',1)');
    g.addColorStop(0.35,'rgba(' + rgb + ',.55)');
    g.addColorStop(1,   'rgba(' + rgb + ',0)');
    c.fillStyle = g;
    c.fillRect(0,0,32,32);
    return s;
  }
  var sprGold = makeSprite('230,200,122');
  var sprCyan = makeSprite('143,220,239');
  var sprWhite= makeSprite('235,240,248');

  // ---- starfield (2 depth layers) ----
  var stars = [];
  for (var i = 0; i < STAR_N; i++){
    stars.push({
      x: Math.random(), y: Math.random(),
      depth: (i % 2 === 0) ? 0.35 : 0.7,
      size: 0.5 + Math.random() * 1.3,
      base: 0.25 + Math.random() * 0.55,
      ph: Math.random() * Math.PI * 2,
      tw: 0.3 + Math.random() * 0.9,
      drift: 0.002 + Math.random() * 0.006
    });
  }

  // ---- orb: Fibonacci sphere of particles ----
  var pts = [];
  var GOLDEN = Math.PI * (3 - Math.sqrt(5));
  for (var j = 0; j < SPHERE_N; j++){
    var y = 1 - (j / (SPHERE_N - 1)) * 2;
    var rr = Math.sqrt(Math.max(0, 1 - y * y));
    var th = GOLDEN * j;
    pts.push({
      x: Math.cos(th) * rr, y: y, z: Math.sin(th) * rr,
      gold: Math.random() < 0.62,
      ph: Math.random() * Math.PI * 2,
      sz: 0.8 + Math.random() * 1.1
    });
  }

  // ---- resonance ripples ----
  var ripples = [];            // {born: seconds}
  var RIPPLE_PERIOD = 2.7;     // spawn interval (s)
  var RIPPLE_LIFE   = 4.6;     // fade-out duration (s)
  var lastSpawn = -RIPPLE_PERIOD + 0.6;

  // ---- parallax (pointer) ----
  var pTx = 0, pTy = 0;        // target in [-1, 1]
  var pX = 0, pY = 0;          // eased current
  function onPointer(x, y){
    pTx = (x / W) * 2 - 1;
    pTy = (y / H) * 2 - 1;
  }
  window.addEventListener('pointermove', function(e){ onPointer(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener('pointerdown', function(e){ onPointer(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener('touchmove', function(e){
    if (e.touches.length) onPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 1.75);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#050914');
    bgGrad.addColorStop(0.55, '#070f24');
    bgGrad.addColorStop(1, '#0a1230');
  }
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      resize();
      if (reduced) draw(0);
    }, 120);
  });
  resize();

  function draw(t){
    // orb anchor: slightly above centre, leaving room for the headline
    var cx = W * 0.5 + pX * 16;
    var cy = H * 0.42 + pY * 12;
    var baseR = Math.min(W, H) * (smallScreen ? 0.30 : 0.27);
    var breathe = 1 + 0.045 * Math.sin(t * 0.55);
    var R = baseR * breathe;

    // background
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // faint core glow behind the orb
    var glowR = R * 2.15;
    glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    glowGrad.addColorStop(0, 'rgba(64,110,140,0.20)');
    glowGrad.addColorStop(0.45, 'rgba(38,66,105,0.10)');
    glowGrad.addColorStop(1, 'rgba(10,18,48,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

    // stars
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var sx = ((s.x + t * s.drift * 0.016) % 1) * W + pX * 20 * s.depth;
      var sy = s.y * H + pY * 14 * s.depth;
      var a = s.base * (0.72 + 0.28 * Math.sin(t * s.tw + s.ph));
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = '#dfe8f2';
      ctx.beginPath();
      ctx.arc(sx, sy, s.size, 0, 6.2832);
      ctx.fill();
    }

    // ripples (behind the orb, expanding concentric rings)
    ctx.globalAlpha = 1;
    for (var k = ripples.length - 1; k >= 0; k--){
      var age = t - ripples[k].born;
      if (age > RIPPLE_LIFE){ ripples.splice(k, 1); continue; }
      var p = age / RIPPLE_LIFE;
      var ease = 1 - Math.pow(1 - p, 2.2);
      var rad = R * (0.92 + ease * 1.9);
      var alpha = Math.pow(1 - p, 1.8) * 0.34;
      ctx.strokeStyle = ripples[k].gold
        ? 'rgba(230,200,122,' + alpha.toFixed(3) + ')'
        : 'rgba(143,220,239,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = 1.3 - p * 0.8;
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, 6.2832);
      ctx.stroke();
    }

    // orb particles
    ctx.globalCompositeOperation = 'lighter';
    var rot = t * 0.07;                 // slow rotation around Y
    var tiltX = 0.42;                   // fixed axial tilt
    var cosY = Math.cos(rot), sinY = Math.sin(rot);
    var cosT = Math.cos(tiltX), sinT = Math.sin(tiltX);
    for (var n = 0; n < pts.length; n++){
      var pt = pts[n];
      // rotate around Y
      var x1 = pt.x * cosY + pt.z * sinY;
      var z1 = -pt.x * sinY + pt.z * cosY;
      // tilt around X
      var y2 = pt.y * cosT - z1 * sinT;
      var z2 = pt.y * sinT + z1 * cosT;
      // gentle per-particle radial shimmer
      var wob = 1 + 0.028 * Math.sin(t * 1.25 + pt.ph);
      var px = cx + x1 * R * wob;
      var py = cy + y2 * R * wob;
      var depth = (z2 + 1) / 2;                       // 0 back → 1 front
      var size = pt.sz * (1.1 + depth * 2.6);
      ctx.globalAlpha = 0.10 + depth * depth * 0.75;
      var spr = pt.gold ? sprGold : sprCyan;
      ctx.drawImage(spr, px - size / 2, py - size / 2, size, size);
    }

    // bright nucleus
    var core = R * 0.30 * (1 + 0.06 * Math.sin(t * 0.55 + 0.6));
    ctx.globalAlpha = 0.16;
    ctx.drawImage(sprWhite, cx - core / 2, cy - core / 2, core, core);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  if (reduced){
    // static single frame: one gentle ripple, no motion
    ripples.push({born: -1.4, gold: false});
    draw(0.9);
  } else {
    var elapsed = 0, lastTs = null, raf = null, spawnCount = 0;
    function frame(ts){
      if (lastTs === null) lastTs = ts;
      var dt = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs = ts;
      elapsed += dt;
      var t = elapsed;
      // ease parallax toward target (frame-rate independent)
      var lerpF = 1 - Math.pow(0.955, dt * 60);
      pX += (pTx - pX) * lerpF;
      pY += (pTy - pY) * lerpF;
      // spawn ripples periodically (alternating gold / cyan)
      if (t - lastSpawn >= RIPPLE_PERIOD){
        ripples.push({born: t, gold: (spawnCount % 2 === 0)});
        spawnCount++;
        lastSpawn = t;
      }
      draw(t);
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', function(){
      if (document.hidden){
        if (raf) cancelAnimationFrame(raf);
        raf = null; lastTs = null;
      } else if (!raf){
        raf = requestAnimationFrame(frame);
      }
    });
  }
})();
</script>
</body>
</html>
