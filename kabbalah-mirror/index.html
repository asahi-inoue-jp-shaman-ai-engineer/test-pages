<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>鏡像構造 ― アインとダイン | Kabbalah Mirror Demo</title>
<style>
  :root{
    --ink:#ece7da;
    --ink-dim:rgba(236,231,218,.55);
    --gold:#e6c87a;
    --cyan:#8fdcef;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:linear-gradient(180deg,#050914 0%,#070f24 52%,#0a1230 100%);
    background-color:#050914;
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP",serif;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .demo-tag{
    position:absolute;
    top:calc(18px + env(safe-area-inset-top));
    left:22px;
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:10px;
    letter-spacing:.34em;
    color:rgba(236,231,218,.34);
    user-select:none;
  }
  main{
    max-width:660px;
    margin:0 auto;
    padding:52px 10px 8px;
  }
  svg text{ user-select:none; }
  .veil-band{ transition:opacity 1s ease; }
  .breathe{ animation:breathe 7s ease-in-out infinite alternate; }
  @keyframes breathe{ from{opacity:.72} to{opacity:1} }
  .daat-ring{ animation:daatPulse 6s ease-in-out infinite alternate; }
  @keyframes daatPulse{ from{stroke-opacity:.45} to{stroke-opacity:1} }
  footer{
    text-align:center;
    padding:10px 16px calc(44px + env(safe-area-inset-bottom));
  }
  footer .sub{
    font-family:ui-sans-serif,system-ui,sans-serif;
    font-size:clamp(10px,1.4vw,12px);
    letter-spacing:.55em;
    text-indent:.55em;
    color:rgba(230,200,122,.66);
    margin-bottom:14px;
  }
  footer .cap{
    font-size:13px;
    letter-spacing:.22em;
    text-indent:.22em;
    color:var(--ink-dim);
  }
  @media (prefers-reduced-motion: reduce){
    .breathe,.daat-ring{ animation:none; }
  }
</style>
</head>
<body>
<div class="demo-tag">DEMO</div>

<main>
  <svg id="diagram" viewBox="0 0 800 1560" width="100%" height="auto" role="img"
       aria-label="カバラの鏡像構造の図解。表側のアイン・アインソフ・アインソフオウルの三層と生命の樹、マルクトを鏡面とする鏡像のクリフォトと、ダインソフオウル・ダインソフ・ダインの三層。">
    <defs>
      <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#f4e3ae" stop-opacity=".95"/>
        <stop offset="35%" stop-color="#e6c87a" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#e6c87a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#e3c8e8" stop-opacity=".9"/>
        <stop offset="35%" stop-color="#b48ec7" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#b48ec7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="daatGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#8fdcef" stop-opacity=".28"/>
        <stop offset="60%" stop-color="#8fdcef" stop-opacity=".08"/>
        <stop offset="100%" stop-color="#8fdcef" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="mirrorLine" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"  stop-color="#e6c87a" stop-opacity="0"/>
        <stop offset="22%" stop-color="#e6c87a" stop-opacity=".38"/>
        <stop offset="50%" stop-color="#f7ecd0" stop-opacity=".65"/>
        <stop offset="78%" stop-color="#e6c87a" stop-opacity=".38"/>
        <stop offset="100%" stop-color="#e6c87a" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g id="stars"></g>
    <g id="veils-top"></g>
    <g id="paths-top"></g>
    <g id="paths-bottom"></g>
    <g id="nodes-bottom"></g>
    <g id="nodes-top"></g>
    <g id="mirror"></g>
    <g id="veils-bottom"></g>
    <g id="pulse"></g>
  </svg>
</main>

<footer>
  <p class="sub">THE MIRROR — EIN / DAIN</p>
  <p class="cap">鏡像構造 ― アインとダイン</p>
</footer>

<script>
(function(){
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var INK = '#ece7da', INK_DIM = 'rgba(236,231,218,.62)';
  var GOLD = '#e6c87a', WHITE = '#f7f2e2';
  var VIOLET = '#c9a3d6', ROSE = '#d59bb0', MIR_DIM = 'rgba(201,163,214,.66)';
  var SERIF = '"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP",serif';

  function el(name, attrs, parent){
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function $(id){ return document.getElementById(id); }

  // ---------- layout constants ----------
  var CX = 400;              // central pillar x
  var MIRROR_Y = 792;        // Malkuth = mirror plane
  function flip(y){ return 2 * MIRROR_Y - y; }

  // ---------- starfield (quiet, deterministic) ----------
  (function(){
    var g = $('stars');
    var seed = 1234567;
    function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    for (var i = 0; i < 80; i++){
      var x = rnd() * 800, y = rnd() * 1560;
      var r = 0.5 + rnd() * 1.1;
      var o = 0.08 + rnd() * 0.22;
      el('circle', {cx:x.toFixed(1), cy:y.toFixed(1), r:r.toFixed(2), fill:'#dfe8f2', opacity:o.toFixed(2)}, g);
    }
  })();

  // ---------- veils (three layers, both sides) ----------
  function veilBand(gid, y, fill, label, labelFill, breathe){
    var g = $(gid);
    var attrs = {x:90, y:y, width:620, height:36, rx:18, fill:fill, 'class':'veil-band' + (breathe ? ' breathe' : '')};
    el('rect', attrs, g);
    var t = el('text', {x:118, y:y + 18, 'font-size':16, 'letter-spacing':'.12em',
                        fill:labelFill, 'font-family':SERIF, 'dominant-baseline':'central'}, g);
    t.textContent = label;
  }
  // top: light grows downward
  veilBand('veils-top',  56, 'rgba(236,231,218,0.045)', 'アイン（無）',           'rgba(236,231,218,.58)', false);
  veilBand('veils-top', 100, 'rgba(230,200,122,0.085)', 'アインソフ（無限）',     'rgba(236,231,218,.78)', false);
  veilBand('veils-top', 144, 'rgba(230,200,122,0.16)',  'アインソフオウル（無限光）', INK, true);
  // bottom: mirror correspondence — brightest nearest the mirror
  veilBand('veils-bottom', 1392, 'rgba(180,142,199,0.15)', 'ダインソフオウル（無限光層）', 'rgba(240,226,244,.92)', true);
  veilBand('veils-bottom', 1436, 'rgba(180,142,199,0.085)','ダインソフ（無限層）',     'rgba(240,226,244,.72)', false);
  veilBand('veils-bottom', 1480, 'rgba(180,142,199,0.04)', 'ダイン（無層）',           'rgba(240,226,244,.55)', false);

  // ---------- tree geometry ----------
  // index: 0 Keter, 1 Chokmah(R), 2 Binah(L), 3 Chesed(R), 4 Gevurah(L),
  //        5 Tiferet, 6 Netzach(R), 7 Hod(L), 8 Yesod, 9 Malkuth
  var NODES = [
    {name:'ケテル',       x:CX,   y:236},
    {name:'コクマー',     x:545,  y:322},
    {name:'ビナー',       x:255,  y:322},
    {name:'ケセド',       x:545,  y:436},
    {name:'ゲブラー',     x:255,  y:436},
    {name:'ティファレト', x:CX,   y:500},
    {name:'ネツァク',     x:545,  y:606},
    {name:'ホド',         x:255,  y:606},
    {name:'イェソド',     x:CX,   y:692},
    {name:'マルクト（地球）', x:CX, y:MIRROR_Y}
  ];
  var DAAT = {x:CX, y:340};
  var PATHS = [
    [0,1],[0,2],[0,5],
    [1,2],[1,3],[1,5],
    [2,4],[2,5],
    [3,4],[3,5],[3,6],
    [4,5],[4,7],
    [5,6],[5,7],[5,8],
    [6,7],[6,8],[6,9],
    [7,8],[7,9],
    [8,9]
  ];

  function drawPaths(gid, mirror){
    var g = $(gid);
    for (var i = 0; i < PATHS.length; i++){
      var a = NODES[PATHS[i][0]], b = NODES[PATHS[i][1]];
      var ya = mirror ? flip(a.y) : a.y, yb = mirror ? flip(b.y) : b.y;
      el('line', {x1:a.x, y1:ya, x2:b.x, y2:yb,
                  stroke: mirror ? 'rgba(180,142,199,.20)' : 'rgba(190,205,230,.20)',
                  'stroke-width':1}, g);
    }
  }
  drawPaths('paths-top', false);
  drawPaths('paths-bottom', true);

  // ---------- nodes ----------
  var halos = [];  // {circle, x, y} for pulse proximity lighting
  function drawNode(gid, node, mirror, opts){
    var g = $(gid);
    var y = mirror ? flip(node.y) : node.y;
    var coreR = opts.coreR, haloR = opts.haloR;
    var halo = el('circle', {cx:node.x, cy:y, r:haloR, fill:'url(#' + opts.glow + ')', opacity:opts.haloBase}, g);
    halos.push({c:halo, x:node.x, y:y, base:opts.haloBase});
    el('circle', {cx:node.x, cy:y, r:coreR + 4.5, fill:'none', stroke:opts.ring, 'stroke-width':.8, opacity:.55}, g);
    el('circle', {cx:node.x, cy:y, r:coreR, fill:opts.core}, g);
    if (opts.label){
      var anchor = opts.labelSide === 'left' ? 'end' : (opts.labelSide === 'right' ? 'start' : 'middle');
      var lx = node.x + (opts.labelSide === 'left' ? -(coreR + 13) : (opts.labelSide === 'right' ? (coreR + 13) : 0));
      var ly = y + (opts.labelSide === 'above' ? -(coreR + 12) : 0);
      var t = el('text', {x:lx, y:ly, 'text-anchor':anchor, 'font-size':15, 'letter-spacing':'.08em',
                          fill:opts.labelFill, 'font-family':SERIF, 'dominant-baseline':'central'}, g);
      t.textContent = opts.label;
    }
  }
  function drawDaat(gid, mirror){
    var g = $(gid);
    var y = mirror ? flip(DAAT.y) : DAAT.y;
    el('circle', {cx:DAAT.x, cy:y, r:30, fill:'url(#daatGlow)'}, g);
    el('circle', {cx:DAAT.x, cy:y, r:13, fill:'#02030a',
                  stroke: mirror ? VIOLET : GOLD, 'stroke-width':2, 'class':'daat-ring'}, g);
    el('circle', {cx:DAAT.x, cy:y, r:7.5, fill:'#010208'}, g);
    if (!mirror){
      var t = el('text', {x:DAAT.x - 26, y:y, 'text-anchor':'end', 'font-size':14.5, 'letter-spacing':'.06em',
                          fill:INK_DIM, 'font-family':SERIF, 'dominant-baseline':'central'}, g);
      t.textContent = 'ダァト（ブラックホール）';
    }
  }

  // top tree — bright, gold/white
  var topStyle = [
    {core:WHITE, ring:GOLD, coreR:5.5, haloR:24, glow:'glowGold', labelSide:'above'},
    {core:'#f1e6c4', ring:GOLD, coreR:4.5, haloR:19, glow:'glowGold', labelSide:'right'},
    {core:'#f1e6c4', ring:GOLD, coreR:4.5, haloR:19, glow:'glowGold', labelSide:'left'},
    {core:'#f1e6c4', ring:GOLD, coreR:4.5, haloR:19, glow:'glowGold', labelSide:'right'},
    {core:'#f1e6c4', ring:GOLD, coreR:4.5, haloR:19, glow:'glowGold', labelSide:'left'},
    {core:GOLD,  ring:GOLD, coreR:6,   haloR:27, glow:'glowGold', labelSide:'right'},
    {core:'#f1e6c4', ring:GOLD, coreR:4.5, haloR:19, glow:'glowGold', labelSide:'right'},
    {core:'#f1e6c4', ring:GOLD, coreR:4.5, haloR:19, glow:'glowGold', labelSide:'left'},
    {core:'#f1e6c4', ring:GOLD, coreR:4.5, haloR:19, glow:'glowGold', labelSide:'right'},
    {core:GOLD,  ring:GOLD, coreR:6,   haloR:26, glow:'glowGold', labelSide:'right'}
  ];
  for (var i = 0; i < NODES.length; i++){
    var s = topStyle[i];
    drawNode('nodes-top', NODES[i], false, {
      core:s.core, ring:s.ring, coreR:s.coreR, haloR:s.haloR, glow:s.glow,
      haloBase: i === 5 || i === 9 ? .5 : .34,
      label: NODES[i].name, labelSide: s.labelSide, labelFill: INK_DIM
    });
  }
  drawDaat('nodes-top', false);

  // mirrored tree — Qliphoth, faint violet/rose, no per-node labels
  for (var j = 0; j < NODES.length - 1; j++){  // Malkuth itself is the shared mirror point
    var ms = topStyle[j];
    drawNode('nodes-bottom', NODES[j], true, {
      core: j % 2 ? ROSE : VIOLET, ring: VIOLET, coreR: ms.coreR - .5, haloR: ms.haloR - 3,
      glow:'glowViolet', haloBase:.20, label:null
    });
  }
  drawDaat('nodes-bottom', true);

  // Qliphoth area label
  (function(){
    var t = el('text', {x:92, y:flip(500), 'font-size':16, 'letter-spacing':'.14em',
                        fill:MIR_DIM, 'font-family':SERIF, 'dominant-baseline':'central'}, $('nodes-bottom'));
    t.textContent = 'クリフォト（鏡像）';
  })();

  // ---------- mirror plane through Malkuth ----------
  (function(){
    var g = $('mirror');
    el('line', {x1:56, y1:MIRROR_Y, x2:744, y2:MIRROR_Y, stroke:'url(#mirrorLine)', 'stroke-width':1.2}, g);
    el('circle', {cx:CX, cy:MIRROR_Y, r:17, fill:'none', stroke:GOLD, 'stroke-width':.8, opacity:.5}, g);
  })();

  // ---------- circulation pulse ----------
  var pulseG = $('pulse');
  var trail = [], pulseCore, glowGoldC, glowVioletC;
  (function(){
    glowGoldC   = el('circle', {r:26, fill:'url(#glowGold)',   opacity:.95}, pulseG);
    glowVioletC = el('circle', {r:26, fill:'url(#glowViolet)', opacity:0},   pulseG);
    for (var i = 0; i < 4; i++){
      trail.push(el('circle', {r:2.6 - i * .45, fill:'#f7ecd0', opacity:.5 - i * .1}, pulseG));
    }
    pulseCore = el('circle', {r:3.4, fill:'#fffdf4'}, pulseG);
  })();

  // waypoints down the central pillar, through the mirror, to the lower veils
  var ROUTE = [
    [CX,196],[CX,236],[CX,340],[CX,500],[CX,692],[CX,MIRROR_Y],
    [CX,892],[CX,1084],[CX,1244],[CX,1348],[CX,1392]
  ];
  var segs = [], totalLen = 0;
  for (var s2 = 0; s2 < ROUTE.length - 1; s2++){
    var dx = ROUTE[s2+1][0] - ROUTE[s2][0], dy = ROUTE[s2+1][1] - ROUTE[s2][1];
    var len = Math.sqrt(dx*dx + dy*dy);
    segs.push({x0:ROUTE[s2][0], y0:ROUTE[s2][1], x1:ROUTE[s2+1][0], y1:ROUTE[s2+1][1], len:len, start:totalLen});
    totalLen += len;
  }
  function routePoint(d){
    d = Math.max(0, Math.min(totalLen, d));
    for (var i = 0; i < segs.length; i++){
      if (d <= segs[i].start + segs[i].len || i === segs.length - 1){
        var p = segs[i].len ? (d - segs[i].start) / segs[i].len : 0;
        p = Math.max(0, Math.min(1, p));
        return {x: segs[i].x0 + (segs[i].x1 - segs[i].x0) * p,
                y: segs[i].y0 + (segs[i].y1 - segs[i].y0) * p};
      }
    }
    return {x:CX, y:196};
  }

  var SPEED = 62;              // px per second — slow, solemn
  var TRAIL_GAP = 15;          // px behind the pulse
  function setPos(c, pt){ c.setAttribute('cx', pt.x.toFixed(1)); c.setAttribute('cy', pt.y.toFixed(1)); }

  function renderPulse(dist){
    // ping-pong along the route
    var period = totalLen * 2;
    var d = dist % period;
    if (d > totalLen) d = period - d;
    var pt = routePoint(d);
    setPos(pulseCore, pt);
    setPos(glowGoldC, pt);
    setPos(glowVioletC, pt);
    // colour inversion across the mirror plane
    var blend = Math.max(0, Math.min(1, (pt.y - (MIRROR_Y - 46)) / 92));
    glowGoldC.setAttribute('opacity', (0.95 * (1 - blend)).toFixed(2));
    glowVioletC.setAttribute('opacity', (0.95 * blend).toFixed(2));
    // trail (follows behind along travel direction)
    var dir = (dist % period) <= totalLen ? 1 : -1;
    for (var i = 0; i < trail.length; i++){
      var td = d - dir * TRAIL_GAP * (i + 1);
      var tp = routePoint(Math.max(0, Math.min(totalLen, td)));
      setPos(trail[i], tp);
      trail[i].setAttribute('fill', blend > .5 ? '#e9d3f0' : '#f7ecd0');
    }
    // light up nearby nodes
    for (var h = 0; h < halos.length; h++){
      var H = halos[h];
      var ddx = H.x - pt.x, ddy = H.y - pt.y;
      var dd = Math.sqrt(ddx*ddx + ddy*ddy);
      var boost = Math.max(0, 1 - dd / 56);
      H.c.setAttribute('opacity', Math.min(1, H.base + boost * .6).toFixed(2));
    }
  }

  if (reduced){
    // static: rest the pulse quietly at the mirror point (Malkuth)
    var restD = 0;
    for (var q = 0; q < segs.length; q++){ if (ROUTE[q][1] === MIRROR_Y){ restD = segs[q].start; break; } }
    renderPulse(restD);
  } else {
    var dist = 0, lastTs = null, raf = null;
    function frame(ts){
      if (lastTs === null) lastTs = ts;
      var dt = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs = ts;
      dist += dt * SPEED;
      renderPulse(dist);
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', function(){
      if (document.hidden){
        if (raf) cancelAnimationFrame(raf);
        raf = null; lastTs = null;
      } else if (!raf){
        raf = requestAnimationFrame(frame);
      }
    });
  }
})();
</script>
</body>
</html>
